<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>折り合い v2.0 説明動画</title>
<style>
:root{--green:#254d47;--paper:#fffdf7;--beige:#f2f1e9;--purple:#4b3a63;--purple2:#775b98;--pro:#2f7d5b;--mid:#c09a3a;--con:#b0503a;--ink:#233b39}
*{box-sizing:border-box}
html,body{margin:0;background:#111}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--ink)}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--beige)}
.scene{position:absolute;inset:0;opacity:0;display:none}
.abs{position:absolute}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#cap{position:absolute;left:0;right:0;bottom:0;height:104px;display:flex;align-items:center;justify-content:center;padding:0 80px;background:linear-gradient(transparent,#0009 30%);color:#fff;font-size:27px;font-weight:700;line-height:1.45;text-align:center;text-shadow:0 2px 6px #000a;z-index:50}
.hdr{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;padding:0 36px;color:#fff;font-size:24px;font-weight:800;gap:18px}
.chip{background:#fff3;border-radius:20px;padding:4px 16px;font-size:18px}
.panel{position:absolute;background:var(--paper);border:2px solid #d8ded2;border-radius:16px}
.cell{position:absolute;width:32px;height:32px;border:2px solid #b6ad98;border-radius:5px;background:#fbf8f1}
.card{position:absolute;width:104px;height:50px;background:#fff;border:1px solid #c7b9a0;border-left:8px solid var(--c);border-radius:7px;padding:4px 8px;font-size:17px;font-weight:800;box-shadow:0 3px 8px #0002}
.card small{display:block;font-size:13px;color:#7a5a33;letter-spacing:2px;font-weight:400}
.bubble{position:absolute;background:#fff;border:2px solid #555;border-radius:14px;padding:8px 14px;font-size:19px;font-weight:700;white-space:nowrap;box-shadow:0 4px 10px #0003}
.stamp{position:absolute;border:5px solid #c0392b;color:#c0392b;font-size:30px;font-weight:900;padding:2px 14px;border-radius:8px;background:#fffc;letter-spacing:4px}
.pop{position:absolute;color:#b0503a;font-weight:900;font-size:24px}
.person{position:absolute;width:76px;text-align:center;font-size:15px;font-weight:700}
.person .h{width:38px;height:38px;border-radius:50%;margin:0 auto 4px}
.person .b{width:62px;height:34px;border-radius:30px 30px 6px 6px;margin:0 auto 4px}
.dice{position:absolute;width:150px;height:150px;border:6px solid #222;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900}
.ev{position:absolute;width:340px;height:300px;border-radius:18px;background:#fff;border-top:10px solid var(--purple2);padding:24px;box-shadow:0 8px 24px #0004}
.ev .turn{font-size:18px;color:#6a5a83;font-weight:700}
.ev .icon{font-size:72px;margin:14px 0}
.ev .name{font-size:26px;font-weight:900;line-height:1.35}
.big{font-size:84px;font-weight:900;letter-spacing:6px}
.tag{display:inline-block;padding:4px 16px;border-radius:20px;color:#fff;font-weight:800;font-size:22px}
.flipcard{position:absolute;width:300px;height:330px;perspective:900px}
.flipcard .in{position:absolute;inset:0;transform-style:preserve-3d}
.flipcard .f,.flipcard .k{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.flipcard .f{background:#3a2c50;color:#fff;font-size:34px;border:3px solid #776496}
.flipcard .k{transform:rotateY(180deg);background:#fff;font-size:40px;border:4px solid currentColor}
.tl{position:absolute;font-size:21px;line-height:1.5;padding-left:26px}
.tl::before{content:'';position:absolute;left:0;top:8px;width:14px;height:14px;border-radius:50%;background:var(--purple2)}
.tl b{color:var(--purple);margin-right:12px}
.judge{position:absolute;width:470px;border-radius:16px;padding:22px 26px;font-size:22px;line-height:1.6;background:#fff}
.judge h3{margin:0 0 8px;font-size:28px}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="cap"></div>
</div>
<script src="build/timeline.js"></script>
<script>
'use strict';
/* ---------- 共通 ---------- */
const TL=window.TIMELINE,T={};TL.forEach(x=>T[x.id]=x);
const TOTAL=TL[TL.length-1].s+TL[TL.length-1].d;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const backOut=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const P=(t,a,b,f=ease)=>f(clamp((t-a)/(b-a)));
const lerp=(a,b,p)=>a+(b-a)*p;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const TYPES={house:['家',1,'#c98b54'],forest:['森',1,'#5d8a4e'],school:['学校',2,'#d1a83a'],park:['公園',2,'#7aa66a'],field:['畑',2,'#a3804a'],rice:['田んぼ',3,'#8c9b3e']};
const STANCE={'-1':['反対','#b0503a'],'0':['条件次第','#c09a3a'],'1':['賛成','#2f7d5b']};
const scenesEl=document.getElementById('scenes'),cap=document.getElementById('cap');
const VS=[];
function scene(ids,build,update){
  const el=document.createElement('div');el.className='scene';scenesEl.appendChild(el);
  const start=T[ids[0]].s,last=T[ids[ids.length-1]],end=last.s+last.d;
  const rel=id=>T[id].s-start;
  const ctx={el,rel,D:end-start};build(ctx);
  VS.push({start,end,ids,ctx,update});
}
function setStyle(e,o){for(const k in o)e.style[k]=o[k];}

/* ---------- 1 タイトル ---------- */
scene(['title'],c=>{
  c.el.style.background='linear-gradient(160deg,#254d47,#1b3632)';
  c.el.innerHTML=`<div class="abs center" style="inset:0;color:#fff">
    <div id="t1" style="font-size:30px;letter-spacing:8px;opacity:.85">福島の除去土壌をめぐる3人のゲーム</div>
    <div id="t2" class="big" style="font-size:150px;margin:18px 0">折り合い</div>
    <div id="t3" style="font-size:28px;background:#fff2;padding:6px 26px;border-radius:30px">v2.0　ゲームの流れ</div></div>`;
},(c,t)=>{
  const q=id=>c.el.querySelector('#'+id);
  setStyle(q('t1'),{opacity:P(t,.2,1.2)*.85,transform:`translateY(${lerp(20,0,P(t,.2,1.2))}px)`});
  setStyle(q('t2'),{opacity:P(t,.5,1.6),transform:`scale(${lerp(.85,1,P(t,.5,1.6,easeOut))})`});
  setStyle(q('t3'),{opacity:P(t,1.4,2.2)});
});

/* ---------- 2 役割 ---------- */
const MAYORS=[['A','原発に近く、避難が続く町','#2f705d'],['B','田畑の広がる町','#5f7d3a'],['C','人が暮らし続けた町','#3d6f8a']];
function mayorIcon(color,size=1){return `<svg width="${110*size}" height="${110*size}" viewBox="0 0 110 110"><circle cx="55" cy="36" r="22" fill="${color}"/><path d="M15 104 Q15 64 55 64 Q95 64 95 104 Z" fill="${color}"/><rect x="47" y="64" width="16" height="22" fill="#fff" opacity=".85"/></svg>`;}
scene(['roles'],c=>{
  c.el.innerHTML=`<div class="abs" style="left:0;right:0;top:70px;text-align:center;font-size:40px;font-weight:900">あなたは、町長です</div>`+
  MAYORS.map((m,i)=>`<div class="panel center rc" style="left:${80+i*390}px;top:170px;width:340px;height:340px;border-color:${m[2]}">
     ${mayorIcon(m[2],1.2)}<div style="font-size:40px;font-weight:900;margin:8px 0;color:${m[2]}">地域${m[0]}</div><div style="font-size:23px;font-weight:700">${m[1]}</div></div>`).join('');
},(c,t)=>{
  c.el.querySelectorAll('.rc').forEach((e,i)=>{const p=P(t,.6+i*1.9,1.4+i*1.9,backOut);setStyle(e,{opacity:clamp(p),transform:`translateY(${lerp(60,0,p)}px)`});});
});

/* ---------- 3 フェーズ1タイトル ---------- */
function phaseTitle(id,bg,label,name,sub){
  scene([id],c=>{
    c.el.style.background=bg;
    c.el.innerHTML=`<div class="abs center" style="inset:0;color:#fff"><div class="pl" style="font-size:36px;letter-spacing:10px;opacity:.85">${label}</div><div class="pn big" style="margin-top:10px">${name}</div>${sub?`<div class="ps" style="font-size:26px;margin-top:20px;opacity:.85">${sub}</div>`:''}</div>`;
  },(c,t)=>{
    setStyle(c.el.querySelector('.pl'),{opacity:P(t,.1,.7)*.85,transform:`translateY(${lerp(-20,0,P(t,.1,.7))}px)`});
    setStyle(c.el.querySelector('.pn'),{opacity:P(t,.4,1.1),letterSpacing:lerp(30,6,P(t,.4,1.4))+'px'});
    const s=c.el.querySelector('.ps');if(s)s.style.opacity=P(t,1.2,1.9)*.85;
  });
}
phaseTitle('p1title','linear-gradient(160deg,#2f705d,#254d47)','フェーズ1','土の行き先','');

/* ---------- 4 盤面（土・頼む・庭先・満杯） ---------- */
const CAP=[9,11,5];
const colX=r=>50+r*400;
const gridPos=(r,i)=>[colX(r)+24+(i%9)*38,232+Math.floor(i/9)*38];
const yardPos=(r,s)=>[colX(r)+24+s*114,410+(s>2?60:0)];
scene(['soil','trade','yard','full'],c=>{
  const {el,rel}=c;
  const a=rel('trade'),b=rel('yard'),f=rel('full');
  c.k={a,b,f};
  let h=`<div class="hdr" style="background:var(--green)">フェーズ1　土の行き先<span class="chip" id="rnd">R1</span></div>`;
  for(let r=0;r<3;r++){
    h+=`<div class="panel" style="left:${colX(r)}px;top:88px;width:380px;height:500px">
      <div style="position:absolute;left:24px;top:14px;font-size:30px;font-weight:900;color:${MAYORS[r][2]}">地域${MAYORS[r][0]}</div>
      <div style="position:absolute;right:22px;top:22px;font-size:17px" ><span id="tok${r}">トークン 5</span>　<span id="anx${r}">不安 0</span></div>
      <div style="position:absolute;left:24px;top:110px;font-size:17px;color:#6a5a43;font-weight:700">仮置場 <span id="cnt${r}"></span></div>
      <div style="position:absolute;left:24px;top:284px;font-size:17px;color:#6a5a43;font-weight:700">庭先（現場保管）</div></div>`;
    for(let i=0;i<CAP[r];i++){const [x,y]=gridPos(r,i);h+=`<div class="cell" id="c${r}_${i}" style="left:${x}px;top:${y}px"></div>`;}
    h+=`<div class="stamp" id="st${r}" style="left:${colX(r)+120}px;top:236px">満杯</div>`;
    h+=`<div class="pop" id="pop${r}" style="left:${colX(r)+250}px;top:380px">不安 +1</div>`;
  }
  h+=`<div class="bubble" id="bq1"></div><div class="bubble" id="bq2"></div><div class="bubble" id="bq3"></div><div class="bubble" id="bq4"></div>
      <svg class="abs" id="arr" style="left:0;top:0" width="1280" height="720"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ac672b"/></marker></defs>
      <path id="ar1" d="" stroke="#ac672b" stroke-width="5" fill="none" marker-end="url(#ah)" stroke-dasharray="10 8"/>
      <path id="ar2" d="" stroke="#ac672b" stroke-width="5" fill="none" marker-end="url(#ah)" stroke-dasharray="10 8"/></svg>
      <div class="abs" id="tokfly" style="width:40px;height:40px;border-radius:50%;background:#e2b74a;border:3px solid #9a7417;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px">1</div>
      <div class="abs center" id="nomore" style="left:0;right:0;top:300px;height:110px;background:#c0392bee;color:#fff;font-size:46px;font-weight:900;letter-spacing:6px">もう、置く場所がない</div>`;
  el.innerHTML=h;
  // 札の動き：[種類, キーフレーム[[t,x,y,不透明度]]]
  const yd=(r,s,t0)=>{const [x,y]=yardPos(r,s);return [[t0,x,y-160,0],[t0+.6,x,y,1]];};
  const toGrid=(r,i,t0)=>{const [x,y]=gridPos(r,i);return [[t0,x-30,y-8,1],[t0+.15,x-30,y-8,0]];};
  c.cards=[
    ['house',[...yd(0,0,.5),[2.6,...yardPos(0,0),1],...toGrid(0,0,3.4)]],
    ['rice',[...yd(1,0,.7),[2.8,...yardPos(1,0),1],...toGrid(1,0,3.6)]],
    ['school',[...yd(2,0,.9),[3.0,...yardPos(2,0),1],...toGrid(2,0,3.8)]],
    // 頼む：Cの公園
    ['park',[...yd(2,0,a+.5),[a+5.0,...yardPos(2,0),1],[a+6.1,...gridPos(1,6).map((v,k)=>v-(k?8:30)),1],[a+6.25,...gridPos(1,6).map((v,k)=>v-(k?8:30)),0]]],
    // 庭先
    ['rice',[...yd(0,0,b+.4)]],
    ['field',[...yd(1,0,b+.6),[b+1.6,...yardPos(1,0),1],...toGrid(1,9,b+2.3)]],
    ['house',[...yd(2,0,b+.8)]],
    // 満杯の後もたまる
    ['forest',[...yd(0,1,f+.3)]],['house',[...yd(1,0,f+.5)]],['school',[...yd(2,1,f+.7)]]
  ];
  c.cards.forEach((cd,k)=>{const [n,s,col]=TYPES[cd[0]];const e=$(`<div class="card" style="--c:${col}">${n}<small>${'●'.repeat(s)}</small></div>`);e.id='card'+k;el.appendChild(e);cd.el=e;});
  c.fill=[[[0,0],[3.55,1],[a,3],[b,7],[f+.2,9]],[[0,0],[3.75,3],[a,5],[a+6.2,7],[b,9],[b+2.45,11]],[[0,0],[3.95,2],[a,4],[b,5]]];
  c.cellColor=[['#c98b54','#5d8a4e','#c98b54','#d1a83a','#d1a83a','#c98b54','#8c9b3e','#8c9b3e','#c98b54'],
               ['#8c9b3e','#8c9b3e','#8c9b3e','#a3804a','#a3804a','#c98b54','#7aa66a','#7aa66a','#c98b54','#a3804a','#a3804a'],
               ['#d1a83a','#d1a83a','#c98b54','#7aa66a','#c98b54']];
},(c,t)=>{
  const {el,k:{a,b,f}}=c,q=id=>el.querySelector('#'+id);
  q('rnd').textContent=t<a?'R1':t<b?'R2':t<f?'R3':'R4';
  for(let r=0;r<3;r++){
    let v=0;for(const [tt,val] of c.fill[r])if(t>=tt)v=val;
    for(let i=0;i<CAP[r];i++){const e=q(`c${r}_${i}`);e.style.background=i<v?c.cellColor[r][i]:'#fbf8f1';e.style.borderColor=i<v?'#6e5a3c':'#b6ad98';}
    q('cnt'+r).textContent=`${v}/${CAP[r]}マス`;
    const sp=P(t,f+1.0+r*.35,f+1.5+r*.35,backOut);
    setStyle(q('st'+r),{opacity:clamp(sp),transform:`rotate(-8deg) scale(${lerp(2.2,1,clamp(sp))})`});
    const anx=(r===0||r===2)&&t>b+3.0?1:0;q('anx'+r).textContent=`不安 ${anx+((r!==1)&&t>f+3?1:0)}`;
    const pp=(r!==1)?P(t,b+3.0,b+3.6):0, po=P(t,b+4.3,b+4.8);
    setStyle(q('pop'+r),{opacity:pp*(1-po),transform:`translateY(${lerp(20,-10,pp)}px)`});
  }
  q('tok1').textContent=`トークン ${t>a+6.4?6:5}`;q('tok2').textContent=`トークン ${t>a+6.4?4:5}`;
  // 札
  for(const cd of c.cards){
    const kf=cd[1];let x=kf[0][1],y=kf[0][2],o=0;
    if(t<kf[0][0]){o=0;}
    else{o=kf[kf.length-1][3];x=kf[kf.length-1][1];y=kf[kf.length-1][2];
      for(let i=0;i<kf.length-1;i++){if(t>=kf[i][0]&&t<kf[i+1][0]){const p=P(t,kf[i][0],kf[i+1][0]);x=lerp(kf[i][1],kf[i+1][1],p);y=lerp(kf[i][2],kf[i+1][2],p);o=lerp(kf[i][3],kf[i+1][3],p);break;}}}
    setStyle(cd.el,{left:x+'px',top:y+'px',opacity:o});
  }
  // 頼む場面
  const bub=(id,text,x,y,t0,t1,color)=>{const e=q(id);e.textContent=text;const p=P(t,t0,t0+.35,backOut),o=1-P(t,t1,t1+.3);setStyle(e,{left:x+'px',top:y+'px',opacity:clamp(p)*o,transform:`scale(${clamp(p)})`,borderColor:color||'#555',color:color||'#233b39'});};
  bub('bq1','空きが足りない。引き受けてくれない？（トークン1）',560,520,a+1.4,a+3.6);
  bub('bq2','✕　うちも余裕がない',110,180,a+2.6,a+3.7,'#b0503a');
  bub('bq3','Bさん、お願いできる？（トークン1）',700,520,a+3.8,a+6.4);
  bub('bq4','○　引き受ける',540,180,a+4.5,a+6.6,'#2f7d5b');
  const arrow=(id,x1,y1,x2,y2,t0,t1)=>{const e=q(id);const p=P(t,t0,t0+.5),o=1-P(t,t1,t1+.3);e.setAttribute('d',`M${x1},${y1} Q${(x1+x2)/2},${Math.min(y1,y2)-120} ${lerp(x1,x2,p)},${lerp(y1,y2,p)}`);e.style.opacity=(p>0?1:0)*o;e.style.strokeDashoffset=-t*30;};
  arrow('ar1',990,400,330,330,a+1.4,a+3.6);
  arrow('ar2',990,400,700,330,a+3.8,a+6.4);
  const tp=P(t,a+5.4,a+6.4);setStyle(q('tokfly'),{left:lerp(1180,780,tp)+'px',top:lerp(130,130,tp)-Math.sin(tp*Math.PI)*60+'px',opacity:t>a+5.4&&t<a+6.6?1:0});
  const np=P(t,f+2.6,f+3.2,easeOut);setStyle(q('nomore'),{opacity:np,transform:`scaleX(${lerp(.6,1,np)})`});
});

/* ---------- 5 どんでん返し（指名→知らせ→引き→施設→全員受け入れ側） ---------- */
const CL={A:[160,0],B:[-100,-130],C:[-100,130]};
const OTH={D:[690,190],E:[470,170],F:[250,250],G:[330,420],H:[560,520],I:[170,500],J:[560,340],K:[830,160],L:[790,530]};
const FX=865,FY=360; // 施設の中心（引いた後）
scene(['nominate','notice','zoom','facility','flip'],c=>{
  const {el,rel}=c;c.k={n1:rel('notice'),n2:rel('zoom'),n3:rel('facility'),n4:rel('flip')};
  let s=`<svg class="abs" width="1280" height="720" style="left:0;top:0" font-family="Hiragino Sans">
   <defs><marker id="ah2" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" refX="20" refY="17" orient="auto"><path d="M0,0 L34,17 L0,34 z" fill="#ac672b"/></marker>
   <marker id="ah3" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#775b98"/></marker></defs>
   <g id="pref"><rect x="110" y="100" width="880" height="490" rx="60" fill="#eef0e6" stroke="#9fac9a" stroke-width="4"/>
     <rect x="990" y="70" width="300" height="560" fill="#d7e6ee"/><text x="1120" y="380" font-size="30" fill="#476a7b" font-weight="700">海</text>
     <circle cx="1010" cy="292" r="12" fill="#444"/><text x="1010" y="272" font-size="16" text-anchor="middle" fill="#444" font-weight="700">原発</text></g>
   <g id="flows">${Object.entries(OTH).map(([k,[x,y]])=>`<path data-k="${k}" d="M${x},${y} L${FX},${FY}" stroke="#775b98" stroke-width="4" stroke-dasharray="8 8" fill="none" marker-end="url(#ah3)"/>`).join('')}</g>
   <ellipse id="fac" cx="${FX}" cy="${FY}" rx="112" ry="132" fill="#775b98" fill-opacity=".38" stroke="#4b3a63" stroke-width="6" stroke-dasharray="14 8"/>
   <g id="others">${Object.entries(OTH).map(([k,[x,y]])=>`<g data-k="${k}"><circle cx="${x}" cy="${y}" r="38" fill="#9a8f84" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y+12}" font-size="32" text-anchor="middle" fill="#fff" font-weight="900">${k}</text>
      <rect x="${x-52}" y="${y+46}" width="104" height="28" rx="6" fill="#c0392b"/><text x="${x}" y="${y+66}" font-size="17" text-anchor="middle" fill="#fff" font-weight="800">仮置場 満杯</text></g>`).join('')}</g>
   <g id="cluster">
     <g id="noms" stroke="#ac672b" stroke-width="10" fill="none" stroke-linecap="round">
       <path d="M86,-53 L-5,-98" marker-end="url(#ah2)"/>
       <path d="M-17,-72 L74,-27" marker-end="url(#ah2)"/>

/* ---------- 時刻を指定して描く ---------- */
function seek(t){
  for(const v of VS){
    const on=t>=v.start&&t<v.end;
    v.ctx.el.style.display=on?'block':'none';
    if(!on)continue;
    const lt=t-v.start,D=v.end-v.start;
    v.ctx.el.style.opacity=Math.min(P(lt,0,.4,x=>x),1-P(lt,D-.4,D,x=>x));
    v.update(v.ctx,lt);
  }
  // 字幕：文ごとに文字数で時間を割る
  let seg=TL.find(s=>t>=s.s&&t<s.s+s.d);let txt='';
  if(seg){const parts=seg.sub.split(/(?<=。)/).filter(Boolean);const tot=parts.reduce((a,p)=>a+p.length,0);
    let acc=seg.s+seg.lead;const span=seg.audio;
    for(const p of parts){const d=span*p.length/tot;if(t<acc+d+.15||p===parts[parts.length-1]){txt=p;break;}acc+=d;}
    if(t<seg.s+seg.lead-.1)txt='';
  }
  cap.textContent=txt;cap.style.opacity=txt?1:0;
}
window.seek=seek;window.TOTAL=TOTAL;
if(!location.search.includes('render')){
  const t0=performance.now();const loop=()=>{const t=(performance.now()-t0)/1000;seek(t%TOTAL);requestAnimationFrame(loop);};loop();
}else seek(0);
</script>
