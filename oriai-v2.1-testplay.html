<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>折り合い v2.1</title>
<style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#233b39;background:#f2f1e9;font-size:15px;
  --green:#254d47;--accent:#ac672b;--purple:#775b98;--paper:#fffdf7;--line:#d8ded2;--pro:#2f7d5b;--mid:#c09a3a;--con:#b0503a}
*{box-sizing:border-box}
body{margin:0;background:#f2f1e9}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid #7c9791;border-radius:8px;background:#fff;color:inherit;padding:10px 16px}
button:hover:not(:disabled){background:#e1efe8}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default;opacity:.4}
button.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
button.primary:hover:not(:disabled){background:#1b3a35}
button.small{padding:5px 10px;font-size:13px}
h1,h2,h3,p{margin:0 0 .6em}
h1{font-size:28px}h2{font-size:21px}h3{font-size:16px;margin-top:14px}
small{font-size:12px;line-height:1.5}
a{color:#245f73}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 24px;background:var(--green);color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:22px}
header .phase-tag{background:#fff2;padding:4px 12px;border-radius:20px;font-size:13px}
header.p2{background:#4b3a63}
main{padding:20px;max-width:1400px;margin:auto}
.card-box{background:#fff;border-radius:12px;padding:28px;max-width:900px;margin:30px auto;border:1px solid #ccd5cb}
.card-box p{line-height:1.9}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.status{min-height:24px;color:#25674a;margin:8px 0}
.flow{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap}
.flow span{padding:8px 12px;background:#e2e5de;flex:1;text-align:center;font-size:13px;min-width:90px}
.flow .active{background:var(--green);color:#fff;font-weight:700}
.flow.p2 .active{background:#4b3a63}
.flow .done{background:#c9d8cf}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.region{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.region.current{border-color:#2f705d;box-shadow:0 0 0 3px #2f705d33}
.region h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.region h2 small{font-weight:400;color:#5f6f69}
.region .story{font-size:13px;color:#4c5d58;line-height:1.6}
.stat{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:6px 0}
.stat span{background:#eef1ea;padding:3px 8px;border-radius:5px}
.storage{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 2px;padding:6px;background:#f4ebda;border-radius:6px;border-left:5px solid #a16831}
.cell{width:22px;height:22px;border:1px solid #b6ad98;background:#fbf8f1;border-radius:3px}
.cell.filled{border-color:#6e5a3c}
.label{font-size:12px;color:#5d6b66;margin-top:8px}
.yard{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.soilcard{display:flex;gap:8px;align-items:center;border:1px solid #c7b9a0;border-left:6px solid var(--c);background:#fff;padding:6px 8px;border-radius:6px;flex-wrap:wrap}
.soilcard b{min-width:52px}
.soilcard .dots{letter-spacing:2px;color:#7a5a33}
.soilcard .new{font-size:11px;background:#ffe1b8;padding:1px 6px;border-radius:4px}
.soilcard .acts{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.empty{font-size:12px;color:#7d8a85}
.panel{background:#fff;border:1px solid #ccd5cb;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.event{border-left:6px solid var(--layer,#3c7868);padding:14px 16px;background:#f7f5ee;margin:10px 0;border-radius:6px}
.event .date{font-size:12px;color:#5d6b66}
.event .effect{font-weight:700;color:#1e4d41;margin-top:6px}
.event .hist{font-size:13px;color:#4c4560;background:#efeaf5;padding:8px 10px;border-radius:6px;margin-top:8px;line-height:1.7}
.log{font-size:12px;max-height:160px;overflow:auto;background:#fafaf6;border:1px solid #e3e6dd;padding:8px;border-radius:6px;line-height:1.7}
.overlay{position:fixed;inset:0;background:#142b37b0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:14px;padding:26px;max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 50px #0005}
.modal p{line-height:1.8}
.residents{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.person{width:44px;text-align:center;font-size:11px;line-height:1.2}
.person .head{width:22px;height:22px;border-radius:50%;margin:0 auto 2px;background:var(--pc)}
.person .body{width:36px;height:18px;border-radius:18px 18px 4px 4px;margin:0 auto;background:var(--pc)}
.person.moved .head,.person.moved .body{animation:pulse 1s 2}
@keyframes pulse{50%{transform:scale(1.25)}}
.legend{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.dice{display:inline-flex;width:64px;height:64px;border:3px solid #333;border-radius:12px;background:#fff;align-items:center;justify-content:center;font-size:34px;font-weight:700}
.dice.rolling{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.voice{font-size:16px;font-weight:700;margin:8px 0;padding:10px 14px;border-radius:8px;background:#f3f1e9;border-left:6px solid var(--vc)}
.mods{font-size:13px;margin:6px 0;padding-left:18px}
.mods li{margin:2px 0}
.tier{display:inline-block;padding:2px 10px;border-radius:20px;color:#fff;font-size:13px;font-weight:700}
.reveal-big{font-size:26px;font-weight:800;line-height:1.5;color:#3d2a55}
.map{width:100%;max-width:640px;display:block;margin:10px auto}
.fade{animation:fade .8s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cover{background:#2c2440;color:#fff;border-radius:14px;padding:40px;text-align:center}
.cover h2{font-size:26px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.choice{padding:22px;font-size:20px;font-weight:800;border-width:2px}
.choice.sel{outline:4px solid var(--accent);background:#fff0d8}
textarea{width:100%;min-height:70px;padding:8px;border:1px solid #9dafaa;border-radius:6px}
input,select{padding:7px;border:1px solid #9dafaa;border-radius:5px}
.timeline{list-style:none;padding:0;margin:0;border-left:4px solid var(--purple)}
.timeline li{padding:6px 0 10px 16px;position:relative;line-height:1.7}
.timeline li::before{content:'';position:absolute;left:-10px;top:12px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--purple)}
.timeline b{display:inline-block;min-width:96px;color:#4b3a63}
.slide{min-height:420px}
.slide-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.quote{border-left:5px solid #7d6aa0;background:#f2eef7;padding:12px 16px;margin:10px 0;line-height:1.85;border-radius:4px}
.src{font-size:12px;color:#5d6b66}
.tagline{display:inline-block;background:#efeaf5;color:#4b3a63;padding:2px 10px;border-radius:12px;font-size:12px;margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #e1e4dc;padding:6px 8px;text-align:left;vertical-align:top}
.goals{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:8px 0 0}
.goals span{padding:4px 10px;border-radius:6px;background:#eef1ea}
.goals .ok{background:#dcefe2;color:#1f5a40}.goals .ng{background:#f7e2dc;color:#8a3a28}
.lands{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.land{border:2px solid #a16831;border-radius:8px;padding:6px 8px;background:#f4ebda;font-size:13px}
.land.closed{border-style:dashed;background:#fbf8f1;border-color:#b9a785}
.land .cells{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.land .cells i{width:18px;height:18px;border-radius:3px;border:1px solid #b6ad98;background:#fff}
.land .cells i.f{background:#3a3a36;border-color:#222}
.land .cells i.x{background:#7a6aa0;border-color:#4b3a63}
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:4px}
.site{border:1px solid #c7b9a0;border-left:6px solid var(--c);background:#fff;border-radius:6px;padding:6px 8px;font-size:13px}
.site.done{background:#eef0ea;border-left-color:#9aa49c;color:#5d6b66}
.site .bags{letter-spacing:1px;color:#222}
.site .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.burden{font-size:11px;color:#8a3a28}
.note{font-size:12px;color:#6b4a2a;background:#fbf2e4;padding:8px 10px;border-radius:6px;margin-top:10px;line-height:1.7}
.tagcon{display:inline-block;font-size:11px;background:#f7e2dc;color:#8a3a28;border-radius:4px;padding:0 6px;margin-left:4px}
.tagok{display:inline-block;font-size:11px;background:#e6efe9;color:#1f5a40;border-radius:4px;padding:0 6px;margin-left:4px}
.pin{display:inline-block;width:10px;height:14px;border-radius:5px 5px 2px 2px;background:#6b5a3a;margin:0 1px;vertical-align:-2px}
.turncard{font-size:13px;background:#f3f6f1;border-radius:6px;padding:8px 10px;margin:10px 0 0;line-height:1.7}
.dcard .vline,.vline{font-size:13px;margin:4px 0;line-height:1.6}
.qtime{background:#f6f3fa;border-radius:8px;padding:12px 14px;margin:10px 0}
.qa{margin:8px 0}
.qq{font-weight:700;font-size:14px}.qq .who{display:inline-block;font-size:11px;background:#4b3a63;color:#fff;border-radius:4px;padding:0 6px;margin-right:6px}
.qans{font-size:13px;background:#fff;border-left:4px solid #775b98;padding:6px 10px;margin-top:4px;line-height:1.7}.qans small{color:#5d6b66;margin-left:4px}
.qpick{display:flex;flex-wrap:wrap;gap:6px}
.say{font-size:13px;color:#3d2a55;margin:6px 0}
.prompt{background:#fff8e8;border:1px solid #e0c98f;border-radius:8px;padding:12px 14px;margin:10px 0;line-height:1.8;font-size:15px}
.timer{font-size:18px;font-weight:700;background:#efeaf5;color:#3d2a55;padding:4px 12px;border-radius:8px}.timer.over{background:#f7e2dc;color:#8a3a28}
</style>
</head>
<body>
<header id="hdr"><h1>折り合い v2.1</h1><span class="phase-tag" id="phaseTag">準備</span></header>
<main id="app"></main>
<div id="modalRoot"></div>
<script>
'use strict';
/* ============================================================
   データ
   ============================================================ */
const TYPES={
  house:{name:'家',soil:1,color:'#c98b54'},
  forest:{name:'森',soil:1,color:'#5d8a4e'},
  school:{name:'学校',soil:2,color:'#d1a83a'},
  park:{name:'公園',soil:2,color:'#7aa66a'},
  field:{name:'畑',soil:2,color:'#a3804a'},
  rice:{name:'田んぼ',soil:3,color:'#8c9b3e'}
};
// 1つの町の3つの地区（プレイヤーは区長）
const DISTRICTS=[
  {key:'A',name:'地区A',sub:'沿岸',story:'原発に近い沿岸の地区。避難が続き、人がいない。公有地が多い。',
   sites:['school','house','house','house','rice','rice','forest'],
   lands:[{name:'公有地',cap:5,burden:0},{name:'公有地',cap:5,burden:0},{name:'田んぼ',cap:5,burden:1}]},
  {key:'B',name:'地区B',sub:'田畑',story:'田畑の広がる地区。土が多く出る。仮置場には田んぼを借りるしかない。',
   sites:['school','house','house','field','rice','rice','rice'],
   lands:[{name:'田んぼ（借りる）',cap:4,burden:1},{name:'田んぼ（借りる）',cap:4,burden:1},{name:'田んぼ（借りる）',cap:4,burden:1}]},
  {key:'C',name:'地区C',sub:'中心',story:'役場や学校のある町の中心。人が暮らし続け、空き地がない。',
   sites:['school','school','house','house','house','house','park'],
   lands:[{name:'公園',cap:3,burden:1}]}
];
const PRIORITY={school:0,house:1,park:2,field:3,rice:3,forest:4};
const ACTIONS_PER_ROUND=2,START_HANDS=0,TOWN_GOAL_LIMIT=6;
const P1EVENTS=[null,
  {date:'2011年夏',title:'除染が始まる',body:'広い範囲で除染が始まった。まず子どもが過ごす学校から。取り除いた土の置き場は、まだどこにもない。',effect:'区長は1ラウンドに行動2回。除染するか、仮置場をつくるか。仮置場は、候補地を使って自分たちでつくる。',hist:'2011年春、郡山市は校庭の表土を取り除いたが、土の置き場が決まらず、処分場の周辺住民から強い反発があった。'},
  {date:'2011〜2012年',title:'仮置場を探す',body:'地区ごとに置き場を探す。公有地を使い、足りなければ誰かの土地を借りる。',effect:'学校がまだ残っていれば、できるだけ早く除染しよう（子どもの場所から）。',hist:'仮置場の確保には地権者や周辺住民の同意が要り、各地で時間がかかった。'},
  {date:'2012〜2013年',title:'田んぼも借りる',body:'田んぼや公園も置き場になる。それでも、除染した家の庭先に土が残る。',effect:'置ききれない土は、除染した場所にそのまま残る（現場保管）。',hist:'置き場がないとき、土は除染した場所で保管された。福島市では2026年になっても現場保管が残っている。'},
  {date:'2013年',title:'どこも満杯',body:'町じゅうの仮置場が埋まっていく。土をまとめて置く、もっと大きな施設が要る。',effect:'このラウンドの終わりに、まだ除染していない場所と現場保管を合わせて6か所以下にする（町の目標）。',hist:'2013年9月、国は「2年で除染し仮置場へ」という一律の目標を見直した。'}
];
const P2EVENTS=[
  {key:'briefing',date:'ターン1',title:'政府の説明会',
   body:'国が説明会を開く。施設の安全対策、30年以内に県外で最終処分する方針、土地の扱いの説明。会場には避難先から集まった住民もいる。',
   hist:'史実：2014年5月31日〜6月15日、大熊町・双葉町の町民や候補地の地権者を対象に、県内10回・県外6回の計16回の説明会が開かれた（環境省）。',
   voices:[
     '「説明を聞いても、何十年も置かれ続けるとしか思えない」　会場に怒りの声が上がる。',
     '「30年後に本当に県外へ運ぶ保証はあるのか」　質問が続くが、答えに納得できない。',
     '「安全の管理の話は分かった。あとは条件次第だ」　説明を聞き、考え始める人がいる。',
     '「このままでは誰も帰れない。前に進めるなら協力したい」　発言に、うなずく人がいる。'
   ]},
  {key:'land',date:'ターン2',title:'政府から土地の買い取りの提案',
   body:'国が、施設の用地を買い取りたいと地権者に提案する。所有を残したまま土地を使う方式（地上権）も選べると説明される。',
   hist:'史実：用地は大熊町・双葉町の約1,600ha。登記上の地権者は2,360人。2014年夏、国は全面買い取りの方針を改め、所有を続けられる方式も示したと報じられた。',
   voices:[
     '「先祖代々の土地を、国に売る気はない」　地権者の集まりで、強い言葉が出る。',
     '「値段の問題ではない。手放したら、戻る場所がなくなる」　契約を見送る人が多い。',
     '「売らずに貸す形も選べるなら、考えてもいい」　条件を確かめ始める人がいる。',
     '「避難先で暮らしを建て直すには、この補償が必要だ」　契約を前向きに考える人が出る。'
   ]},
  {key:'time',date:'ターン3',title:'時間の経過と、住民からの決断の要請',
   body:'避難と仮置きが長引く。地区のあちこちから「区長、地区としての考えをまとめてほしい」という声が上がる。',
   hist:'史実：2014年9月1日、県知事が建設受け入れを容認し、両町長は地権者への説明を了承した。両町は2015年1月に建設受け入れを容認した（環境省）。',
   voices:[
     '「急かされて決めることではない。もっと待ってほしい」　時間をかけるよう求める声。',
     '「町が受け入れたら、もう二度と戻れない気がする」　不安を口にする人が増える。',
     '「庭先や仮置場の土を、いつまでもこのままにはできない」　早い決着を求める声。',
     '「どちらでもいい。私たちは次に進みたい」　決めること自体を求める声が強まる。'
   ]}
];
// 地域ごとの事情（ターン別の補正）
const REGION_MODS=[
  [[],[{v:+1,t:'帰還が難しく、避難先での生活再建に資金が要る'}],[{v:+1,t:'避難が長引き、先の見通しがほしい'}]],
  [[],[{v:-1,t:'田んぼは代々の暮らしそのもの'}],[]],
  [[{v:-1,t:'施設の近くで暮らし続けることへの不安'}],[],[]]
];
const TIERS=[ // 出目→段階
  {min:1,max:1,shift:-2,name:'強く否定的',color:'#b0503a',vi:0},
  {min:2,max:3,shift:-1,name:'否定的',color:'#c9744e',vi:1},
  {min:4,max:5,shift:+1,name:'肯定的',color:'#4c8c63',vi:2},
  {min:6,max:6,shift:+2,name:'強く肯定的',color:'#2f7d5b',vi:3}
];
const STANCE={'-1':{n:'反対',c:'var(--con)'},'0':{n:'条件次第',c:'var(--mid)'},'1':{n:'賛成',c:'var(--pro)'}};
const OTHERS=['D','E','F','G','H','I','J','K'];
// フェーズ2の話し合いの支え（docs/phase2-rules-draft.md）
const DISTRICT_CARDS=[
  {face:'原発に近い沿岸の地区。住民は避難していて、町に戻れる見通しが立たない。公有地が多い。',
   worries:['避難先での暮らしの建て直しに、お金と時間がかかっている。','先が決まらないまま、時間だけが過ぎていく。','戻れないなら、土地をどうするかを決めなければならない。'],
   voices:[['帰れないなら、せめて先の見通しがほしい','避難先で暮らす70代'],['先祖の土地を手放すのは、自分の代で終わらせることになる','地権者']],
   home:'自分の暮らしでは、先が見えないまま待たされるのが一番つらいと思う。'},
  {face:'田畑の広がる地区。土が多く出た。仮置場には田んぼを貸してきた。',
   worries:['貸した田んぼが、本当に元どおりになって戻るのか。','田んぼは代々の暮らしそのもの。手放したら、農業を続けられない。','農産物が売れるか（風評）も気がかり。'],
   voices:[['田んぼを貸したのは、元どおりにして返すと約束したからだ','田んぼを貸した農家'],['息子は町を出た。この田んぼを継ぐ人は、もういないかもしれない','60代の農家']],
   home:'自分の暮らしでは、うちの田んぼだったら、まず元に戻るのかを確かめたい。'},
  {face:'役場や学校のある町の中心。人が暮らし続けている。空き地が少ない。',
   worries:['施設のすぐ近くで、これからも暮らし続けることになる。','子どもの通う学校が、運び込む車の通り道になるかもしれない。','庭先に残る土を、早く運び出してほしい人もいる。'],
   voices:[['子どもを安心して外で遊ばせたい','子育て中の親'],['庭の土が早くなくなるなら、施設があってもいい','家の庭に土を置いている人']],

const QUESTIONS=[
  {q:'30年後に、本当に県外へ運び出すの？',a:'運び込み開始から30年以内（2045年3月まで）に、福島県外で最終処分すると法律に書かれました（2014年11月）。ただ、どこで処分するかは、まだ決まっていません。',src:'環境省、中間貯蔵・環境安全事業株式会社法'},
  {q:'土地は、国に売らないといけないの？',a:'売る（売買）のほかに、土地を持ったまま国が使う「地上権」を設定する契約もあります。',src:'環境省福島地方環境事務所の契約記録'},
  {q:'仮置場に貸した田んぼは、戻ってくるの？',a:'土を運び出したあと、元の状態に戻して（原状回復）、土地の持ち主に返します。県内の多くの市町村で、返す作業が進んでいます。',src:'環境省、福島県'},
  {q:'どのくらいの土が運び込まれるの？',a:'県内の除染で出た土などで、約1,447万m³（2026年8月末時点）。東京ドームおよそ12杯分です。',src:'環境省「データでみる福島再生」'},
  {q:'施設の広さと、地権者の数は？',a:'施設の区域は約1,600ha。登記上の地権者は2,360人です。2026年8月末までに、1,990人と約1,321haの契約が結ばれました。',src:'環境省「データでみる福島再生」'},
  {q:'地元への支援は？',a:'2014年8月、国は交付金などをあわせて総額3,010億円の財政措置を示しました。',src:'環境省'},
  {q:'住民への説明は、どのくらい開かれたの？',a:'2014年5〜6月、県内10回・県外6回の計16回、説明会を開きました。避難先の住民にも参加してもらうためです。',src:'環境省（2014/5/21 報道発表）'},
  {q:'安全は、どうやって確かめるの？',a:'施設のまわりで空間の放射線量や地下水などを測り、結果を公表しています。地元の人や専門家が加わる会議でも確かめています。',src:'環境省'}
];
const HOME_PROMPTS=['もし、あなたの家の近くに、この施設ができるとしたら？','もし、あなたの家の田んぼや畑が、この施設の用地になるとしたら？','もし、あなたの子ども（家族）が通う学校の近くに、この施設ができるとしたら？'];
const MEETING_SEC=[0,120,180];


/* ============================================================
   状態
   ============================================================ */
let S=null;
const sum=a=>a.reduce((x,y)=>x+y,0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(){S.rng=(Math.imul(S.rng,1664525)+1013904223)>>>0;return S.rng/4294967296;}
function log(t){S.log.push({round:S.round,phase:S.phase,at:new Date().toISOString(),t});}
const ownFree=d=>sum(d.lands.filter(l=>l.open).map(l=>l.cap-l.used));
const onsiteSites=d=>d.sites.filter(s=>s.onsite>0).length;
const townOnsite=()=>sum(S.regions.map(onsiteSites));
const undoneSites=d=>d.sites.filter(s=>!s.done).length;
const townGoalCount=()=>sum(S.regions.map(d=>undoneSites(d)+onsiteSites(d)));

function newGame(seed,humans){
  S={version:'2.1',seed,rng:seed>>>0,startedAt:new Date().toISOString(),phase:'p1',step:'event',round:0,actor:0,
     regions:[],pending:null,choose:null,log:[],serial:0,townMods:[],qa:[],meeting:0,met1:false,homePrompt:0,revealStep:0,
     p2:{turn:0,idx:0,rolling:false,last:null},decIdx:0,decCover:true,slide:0};
  DISTRICTS.forEach((D,i)=>{
    S.regions.push({i,key:D.key,name:D.name,sub:D.sub,human:humans[i],
      sites:D.sites.map(t=>({id:'s'+(++S.serial),type:t,soil:TYPES[t].soil,done:false,onsite:0})),
      lands:D.lands.map(l=>({id:'l'+(++S.serial),...l,open:false,used:0,foreign:0})),
      hands:START_HANDS,actions:0,received:0,sent:0,flipped:0,asked:false,
      nominate:null,nomReason:'',home:'',residents:[-1,-1,0,0,1,1],startNotes:[],rolls:[],memos:['','',''],decision:null,reason:''});
  });
  log('ゲーム開始 seed='+seed);
  startRound();
}

/* ---------------- フェーズ1（半協力型・3地区・ルール案第2版） ---------------- */
function startRound(){S.round++;S.actor=0;S.step='event';log(`R${S.round} 開始：${P1EVENTS[S.round].title}`);render();}
function beginTurns(){S.step='turn';S.actor=0;startActorTurn();}
function startActorTurn(){const d=S.regions[S.actor];d.actions=ACTIONS_PER_ROUND;S.choose=null;render();maybeCpu();}
function putInto(d,n,foreign){
  let placed=0;
  for(const l of d.lands){if(!l.open)continue;const k=Math.min(n-placed,l.cap-l.used);if(k>0){l.used+=k;if(foreign)l.foreign+=k;placed+=k;}}
  return placed;
}
// 除染する：場所を選ぶ → 置き場を選ぶ（自分の仮置場／他の地区に頼む／その場に置く）
function startDecon(i,sid){
  const d=S.regions[i],s=d.sites.find(x=>x.id===sid);if(!s||s.done||d.actions<1)return;
  S.choose={i,sid,n:s.soil,refused:[]};
}
function finishDecon(dest){
  const c=S.choose;if(!c)return;
  const d=S.regions[c.i],s=d.sites.find(x=>x.id===c.sid),nm=TYPES[s.type].name;
  s.done=true;d.actions--;S.choose=null;
  if(dest==='own'){putInto(d,c.n);s.onsite=0;log(`${d.name}：${nm}を除染。土${c.n}を自分の仮置場へ`);}
  else if(dest==='site'){s.onsite=c.n;log(`${d.name}：${nm}を除染。土${c.n}はその場に残った（現場保管）`);}
  else{
    const T=S.regions[dest.to];putInto(T,c.n,true);s.onsite=0;T.hands++;T.received+=c.n;d.sent+=c.n;
    log(`${T.name}が${d.name}の${nm}の土${c.n}を引き受けた（引き受けた印を1つ受け取った）`);
  }
}
// 仮置場をつくる：自分の地区の現場保管が、入る分だけ自動で移る
function flip(i,lid){
  const d=S.regions[i],l=d.lands.find(x=>x.id===lid);if(!l||l.open||d.actions<1)return;
  l.open=true;if(l.burden)d.flipped++;d.actions--;
  let moved=0;
  for(const s of [...d.sites].filter(s=>s.onsite>0).sort((a,b)=>b.onsite-a.onsite)){
    if(ownFree(d)>=s.onsite){putInto(d,s.onsite);moved+=s.onsite;s.onsite=0;}
  }
  log(`${d.name}：${l.name}を仮置場にした（容量${l.cap}${l.burden?'・住民の負担あり':''}）${moved?`。現場保管の土${moved}を移した`:''}`);
}
function request(to){
  const c=S.choose;if(!c)return;
  S.pending={from:c.i,to,sid:c.sid,n:c.n};
  if(!S.regions[to].human)respond(cpuAccept(S.pending));else render();
}
function cpuAccept(p){
  const T=S.regions[p.to],room=ownFree(T)-p.n;
  if(room<0)return false;
  if(T.hands<1)return true;
  return room>=3;
}
function respond(ok){
  const p=S.pending;if(!p)return;
  const F=S.regions[p.from],T=S.regions[p.to];
  S.pending=null;
  if(ok&&ownFree(T)>=p.n&&S.choose){
    finishDecon({to:p.to});
    flash(`${T.name}が引き受けました。`);
  }else{
    if(S.choose)S.choose.refused.push(p.to);
    log(`${T.name}は${F.name}の頼み（土${p.n}）を断った`);
    flash(`${T.name}は断りました。ほかの置き場を選んでください。`);
    if(!F.human&&S.choose)finishDecon(ownFree(F)>=p.n?'own':'site');
  }
  render();
  if(!F.human)setTimeout(cpuStep,500);
}
function endTurn(){
  const d=S.regions[S.actor];S.choose=null;
  log(`${d.name}：手番終了（現場保管 ${onsiteSites(d)}か所）`);
  if(S.actor<2){S.actor++;startActorTurn();}else endRound();
}
function endRound(){
  if(S.round>=4){finishPhase1();return;}
  S.step='roundEnd';render();
}
const onsiteSupport=n=>n<=1?0:n<=3?1:2;
function finishPhase1(){
  const g=townGoalCount();
  if(g>TOWN_GOAL_LIMIT)S.townMods.push({v:-1,t:`まだ除染していない場所と現場保管が、合わせて${g}か所残った。「町を信用できない」`});
  S.regions.forEach(d=>{
    if(d.flipped>0){shiftResidents(d,-d.flipped);d.startNotes.push(`田んぼや公園を仮置場に${d.flipped}か所差し出した：${d.flipped}人が反対側へ「もう十分、土地を差し出した」`);}
    if(d.hands>=2){shiftResidents(d,-1);d.startNotes.push(`引き受けた印が${d.hands}つ：1人が反対側へ「よその地区の土まで」`);}
    const n=onsiteSites(d),k=onsiteSupport(n);
    if(k>0){shiftResidents(d,k);d.startNotes.push(`現場保管が${n}か所残った：${k}人が賛成側へ「早く運び出してほしい」`);}
  });
  S.phase='p1end';log(`フェーズ1終了：まだ除染していない場所と現場保管 ${g}か所（目標${TOWN_GOAL_LIMIT}以下）`);render();
}
function maybeCpu(){if(S.phase==='p1'&&S.step==='turn'&&!S.regions[S.actor].human)setTimeout(cpuStep,500);}
function cpuStep(){
  if(S.phase!=='p1'||S.step!=='turn'||S.pending)return;
  const d=S.regions[S.actor];if(d.human)return;
  const next=()=>{render();setTimeout(cpuStep,350);};
  if(d.actions<1)return endTurn();
  const todo=d.sites.filter(s=>!s.done).sort((a,b)=>PRIORITY[a.type]-PRIORITY[b.type]);
  if(!todo.length)return endTurn();
  const s=todo[0],closed=d.lands.filter(l=>!l.open).sort((a,b)=>a.burden-b.burden);
  if(ownFree(d)<s.soil&&closed.length){flip(d.i,closed[0].id);return next();}
  startDecon(d.i,s.id);
  if(ownFree(d)>=s.soil){finishDecon('own');return next();}
  const to=S.regions.filter(o=>o!==d&&ownFree(o)>=s.soil).sort((a,b)=>ownFree(b)-ownFree(a))[0];
  if(to){request(to.i);return;}
  finishDecon('site');return next();
}

/* ---------------- 候補の話し合い・明かし ---------------- */
function nominateCpu(){
  S.regions.forEach(r=>{if(!r.human&&r.nominate===null){
    const score=o=>ownFree(o)+sum(o.lands.filter(l=>!l.open).map(l=>l.cap));
    const others=S.regions.filter(o=>o!==r).sort((a,b)=>score(b)-score(a));
    r.nominate=others[0].i;r.nomReason=`${others[0].name}のほうが土地に余裕がある`;
  }});
}

/* ---------------- フェーズ2 ---------------- */
function modsFor(i,t){return [...REGION_MODS[i][t],...(t===0?S.townMods:[])];}
function shiftResidents(r,n){
  const moved=[];
  for(let k=0;k<Math.abs(n);k++){
    let idx;
    if(n>0){idx=r.residents.indexOf(0);if(idx<0)idx=r.residents.indexOf(-1);if(idx<0)break;r.residents[idx]++;}
    else{idx=r.residents.indexOf(0);if(idx<0)idx=r.residents.indexOf(1);if(idx<0)break;r.residents[idx]--;}
    moved.push(idx);
  }
  return moved;
}
function doRoll(face){
  const t=S.p2.turn,i=S.p2.idx,r=S.regions[i];
  const mods=modsFor(i,t),mod=sum(mods.map(m=>m.v));
  const val=Math.max(1,Math.min(6,face+mod));
  const tier=TIERS.find(x=>val>=x.min&&val<=x.max);
  const moved=shiftResidents(r,tier.shift);
  const res={turn:t,face,mod,val,tier:tier.name,shift:tier.shift,voice:P2EVENTS[t].voices[tier.vi],moved};
  r.rolls[t]=res;S.p2.last=res;
  log(`${P2EVENTS[t].title}：${r.name} 出目${face}${mod?`（補正${mod>0?'+':''}${mod}→${val}）`:''} ${tier.name}`);
  render();
  if(!r.human)setTimeout(()=>{if(S.p2.last===res)nextRoll();},2200);
}
function rollAnim(){
  if(S.p2.rolling)return;S.p2.rolling=true;render();
  setTimeout(()=>{S.p2.rolling=false;doRoll(1+Math.floor(Math.random()*6));},900);
}
function nextRoll(){
  S.p2.last=null;
  if(S.p2.idx<2){S.p2.idx++;}
  else{S.p2.idx=3;} // 3=ターン終了表示
  render();
  if(S.p2.idx<3&&!S.regions[S.p2.idx].human)setTimeout(rollAnim,700);
}
function nextTurn(){
  if(S.p2.turn===0&&!S.met1){startMeeting(1);return;}
  if(S.p2.turn<2){S.p2.turn++;S.p2.idx=-1;S.p2.last=null;cpuAsk(S.p2.turn);render();}
  else startMeeting(2);
}
function startTurnRolls(){S.p2.idx=0;S.p2.last=null;render();if(!S.regions[0].human)setTimeout(rollAnim,600);}
function cpuDecide(r){
  const pro=r.residents.filter(x=>x===1).length,mid=r.residents.filter(x=>x===0).length;
  const p=(pro+0.5*mid)/6+0.15;
  r.decision=Math.random()<p?'accept':'reject';
  r.reason=r.decision==='accept'?'地区の土を置く場所が他にない。条件を確かめながら協力する。':'住民の多くが納得していない。今は受け入れられない。';
}
const count=(r,v)=>r.residents.filter(x=>x===v).length;

/* ============================================================
   描画
   ============================================================ */
const app=document.getElementById('app'),modalRoot=document.getElementById('modalRoot');
let flashMsg='';
function flash(m){flashMsg=m;}
function setHeader(){
  const h=document.getElementById('hdr'),tag=document.getElementById('phaseTag');
  const p2=['reveal','p2intro','p2','meeting','decide','outcome','reflect'].includes(S?.phase);
  h.className=p2?'p2':'';
  tag.textContent=!S?'準備':S.phase==='p1'?`フェーズ1　土の行き先　R${S.round}`:S.phase==='p1end'||S.phase==='nominate'?'フェーズ1　終わり':
    S.phase==='reveal'?'知らせ':S.phase==='p2intro'?'フェーズ2　地区の事情':S.phase==='meeting'?`フェーズ2　区長会議${S.meeting}`:S.phase==='p2'?`フェーズ2　受け入れの問い　ターン${S.p2.turn+1}/3`:S.phase==='decide'?'フェーズ2　区長の決断':
    S.phase==='outcome'?'決断のあと':'振り返り';
}
function render(){
  clearInterval(window._mt);setHeader();modalRoot.innerHTML='';
  if(!S)return renderSetup();
  ({p1:renderP1,p1end:renderP1End,nominate:renderNominate,reveal:renderReveal,p2intro:renderP2Intro,p2:renderP2,meeting:renderMeeting,decide:renderDecide,outcome:renderOutcome,reflect:renderReflect})[S.phase]();
  flashMsg='';
}
function modal(html){modalRoot.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}

/* ---------- 準備 ---------- */

/* ---------- フェーズ1 ---------- */
function goalsHtml(){
  const u=sum(S.regions.map(undoneSites)),o=townOnsite(),g=u+o;
  const done=S.phase!=='p1';
  const cls=!done?'':g<=TOWN_GOAL_LIMIT?'ok':'ng';
  return `<div class="goals"><strong>町の目標</strong>
    <span class="${cls}">まだ除染していない場所 ${u} ＋ 現場保管 ${o} ＝ <b>${g}か所</b>（R4の終わりに${TOWN_GOAL_LIMIT}以下）</span></div>`;
}
function landHtml(d,l,cur){
  const tag=l.burden?'<span class="tagcon">反対＋1</span>':'<span class="tagok">負担なし</span>';
  if(!l.open){
    let cells='';for(let k=0;k<l.cap;k++)cells+='<i></i>';
    return `<div class="land closed"><b>候補地：${esc(l.name)}</b> ${tag}<div class="cells">${cells}</div>
      ${cur?`<div style="margin-top:4px"><button class="small" data-flip="${l.id}" ${d.actions<1?'disabled':''}>仮置場をつくる</button></div>`:''}</div>`;
  }
  let cells='';
  for(let k=0;k<l.cap;k++)cells+=`<i class="${k<l.used-l.foreign?'f':k<l.used?'x':''}"></i>`;
  return `<div class="land"><b>仮置場：${esc(l.name)}</b> ${tag}${l.foreign?`<span style="font-size:11px;color:#4b3a63">　紫＝よその地区の土</span>`:''}<div class="cells">${cells}</div></div>`;
}
function siteHtml(d,s,cur){
  const T=TYPES[s.type];
  const act=cur&&!s.done?`<div class="acts"><button class="small" data-decon="${s.id}" ${d.actions<1?'disabled':''}>除染する</button></div>`:'';
  const soil=s.done?(s.onsite>0?`<div style="color:#8a3a28;font-size:12px">現場保管 <span class="bags">${'■'.repeat(s.onsite)}</span></div>`:'<div style="font-size:12px">除染済み</div>')
    :`<span class="bags" title="出る土">${'□'.repeat(s.soil)}</span>`;
  return `<div class="site ${s.done?'done':''}" style="--c:${T.color}"><b>${T.name}</b> ${soil}${act}</div>`;
}
function handsHtml(d){
  if(!d.hands)return '<span>引き受けた印 なし</span>';
  return `<span>引き受けた印 ${'<i class="pin"></i>'.repeat(d.hands)}${d.hands>=2?'<span class="tagcon">反対＋1</span>':''}</span>`;
}
function regionPanel(d,i){
  const cur=S.step==='turn'&&S.actor===i&&d.human&&!S.pending&&!S.choose;
  const active=S.step==='turn'&&S.actor===i;
  return `<section class="region ${active?'current':''}">
   <h2>${d.name}（${d.sub}） <small>${d.human?'人':'CPU'}${active?'・手番':''}</small></h2>

function mapSvg(step){
  // 県の形（簡略）と地域。A・B・Cは海側中央
  const pos={A:[455,250],B:[395,205],C:[395,300],D:[300,120],E:[200,170],F:[110,250],G:[190,310],H:[300,380],I:[150,380],J:[285,245],K:[130,110]};
  let g=`<rect x="40" y="60" width="480" height="370" rx="40" fill="#eef0e6" stroke="#9fac9a" stroke-width="3"/>
   <rect x="520" y="60" width="60" height="370" fill="#d7e6ee"/><text x="550" y="250" font-size="14" fill="#476a7b" writing-mode="tb">海</text>
   <circle cx="505" cy="250" r="9" fill="#555"/><text x="505" y="232" text-anchor="middle" font-size="11" fill="#555">原発</text>`;
  const node=(k,x,y,color,label)=>`<g class="fade"><circle cx="${x}" cy="${y}" r="30" fill="${color}" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">${k}</text>${label?`<text x="${x}" y="${y+46}" text-anchor="middle" font-size="11" fill="#7a3b2a">${label}</text>`:''}</g>`;
  if(step>=2)OTHERS.forEach(k=>{if(pos[k]){const [x,y]=pos[k];g+=`<line class="fade" x1="${x}" y1="${y}" x2="415" y2="252" stroke="#775b98" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>`;}});
  if(step>=2)g+=`<g class="fade"><ellipse cx="420" cy="252" rx="66" ry="84" fill="#775b98" fill-opacity=".35" stroke="#4b3a63" stroke-width="4" stroke-dasharray="8 5"/>
     <text x="420" y="358" text-anchor="middle" font-size="14" font-weight="800" fill="#4b3a63">中間貯蔵施設（予定）</text></g>`;
  if(step>=1)OTHERS.forEach(k=>{if(pos[k])g+=node(k,pos[k][0],pos[k][1],'#9a8f84','満杯の町');});
  g+=`<rect x="340" y="166" width="160" height="182" rx="30" fill="none" stroke="#254d47" stroke-width="3" stroke-dasharray="6 5"/><text x="420" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#254d47">この町</text>`;
  ['A','B','C'].forEach(k=>g+=node(k,pos[k][0],pos[k][1],'#2f705d',''));
  return `<svg class="map" viewBox="20 40 580 420" role="img" aria-label="県内の地域と施設の予定地">${g}</svg>`;
}

}

}
function cpuAsk(t){
  if(t===0){S.regions.forEach(d=>{if(!d.human&&!S.qa.some(x=>x.turn===0&&x.who===d.i)){const qi=QUESTIONS.map((_,k)=>k).reverse().find(k=>!usedQ().includes(k));if(qi!==undefined)askQ(0,d.i,qi);}});}
  else if(S.regions.every(d=>!d.human)&&!S.qa.some(x=>x.turn===t)){const qi=QUESTIONS.findIndex((_,k)=>!usedQ().includes(k));if(qi>=0)askQ(t,'town',qi);}
}
function qaItem(x){
  const Q=QUESTIONS[x.qi];
  return `<div class="qa"><div class="qq"><span class="who">${x.who==='town'?'町':S.regions[x.who].name}</span>${Q.q}</div><div class="qans"><b>国の回答</b>　${Q.a}<small>（${Q.src}）</small></div></div>`;
}
function qaPanel(t){
  const now=S.qa.filter(x=>x.turn===t);
  let picker='',ready=true;
  const qButtons=who=>QUESTIONS.map((Q,k)=>usedQ().includes(k)?'':`<button class="small" data-ask="${who}" data-qi="${k}">${Q.q}</button>`).join('');
  if(t===0){
    const next=S.regions.find(d=>d.human&&!now.some(x=>x.who===d.i));
    ready=S.regions.every(d=>now.some(x=>x.who===d.i));
    if(next)picker=`<p><b>${next.name}の区長</b>：質問を1つ選んで、読み上げてください。</p><div class="qpick">${qButtons(next.i)}</div>`;
  }else if(!now.length&&S.regions.some(d=>d.human)){
    picker=`<p>町として、国に1つだけ聞けます（聞かなくてもよい）。</p><div class="qpick">${qButtons('town')}</div>`;
  }
  return {ready,html:`<div class="qtime"><h3 style="margin-top:0">質問タイム（国の担当者に聞く）</h3>
    <p class="say">国の担当者：「わからないことは、遠慮なく聞いてください」</p>
    ${now.map(qaItem).join('')}
    ${now.length?'<p class="say">国の担当者：「この答えで、心配は減りましたか。それとも、まだ残っていますか」</p>':''}
    ${picker}
    <p class="note">カードにない質問をしてもかまいません。進行役が答えられなければ「持ち帰って調べます」と答えます。</p></div>`};
}
function bindQa(t){
  app.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{const w=b.dataset.ask;askQ(t,w==='town'?'town':+w,+b.dataset.qi);render();});
}
// 区長会議
function startMeeting(n){S.phase='meeting';S.meeting=n;S.meetStart=Date.now();render();}
function endMeeting(){
  if(S.meeting===1){S.met1=true;S.phase='p2';S.p2.turn=1;S.p2.idx=-1;S.p2.last=null;cpuAsk(1);}
  else{S.regions.forEach(d=>{if(!d.human&&!d.home)d.home=DISTRICT_CARDS[d.i].home;});S.phase='decide';S.decIdx=0;S.decCover=true;}
  log(`区長会議${S.meeting}が終わった`);render();
}
function renderMeeting(){
  const n=S.meeting,sec=MEETING_SEC[n];
  const common=`<p class="say">進行役：「どの判断にも理由があります。説得はしてもよいですが、責めるのはなしです。何も決めなくてかまいません」</p>`;
  let body='';
  if(n===1){
    body=`<div class="prompt">事情カードと国の答えを使って、ひとりずつ話しましょう。<br><b>「〔根拠〕だから、〔お願い〕してほしい」</b>の形で、ほかの区長か国に一言。</div>
      <div class="board">${S.regions.map(d=>`<div>${districtCardHtml(d,false)}<div class="region" style="margin-top:6px">${residentsHtml(d)}</div></div>`).join('')}</div>`;
  }else{
    const p=S.homePrompt??0;
    body=`<div class="prompt"><small>ゲームのことは、いったん置いてください。</small><br><b>${HOME_PROMPTS[p]}</b>
      <div class="row" style="margin-top:8px;font-size:12px">問いを変える：${HOME_PROMPTS.map((_,k)=>`<button class="small ${k===p?'primary':''}" data-hp="${k}">${k+1}</button>`).join('')}</div></div>
      <p>1人1文ずつ、順番に答えてください（1人20秒）。答える前に「自分の暮らしでは」と一言添えます。パスしてもかまいません。正解はありません。</p>
      <div class="board">${S.regions.map(d=>`<section class="region"><h2>${d.name}の区長 <small>${d.human?'人':'CPU'}</small></h2>
        ${d.human?`<label style="font-size:13px">自分の暮らしでは…（任意・振り返りに残ります）<textarea data-home="${d.i}" placeholder="例：家の近くなら、まず子どもの通学路が気になる">${esc(d.home||'')}</textarea></label>`
          :`<p class="vline">「${DISTRICT_CARDS[d.i].home}」</p>`}</section>`).join('')}</div>
      <div class="prompt" style="margin-top:12px">全員が答えたら：<b>「では、区長としてはどうしますか」</b>　自由に話しましょう（2分）。</div>`;
  }
  const qa=S.qa.length?`<details open><summary>これまでの質問と国の回答（${S.qa.length}）</summary>${S.qa.map(qaItem).join('')}</details>`:'';
  app.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">区長会議${n}</h2><span class="timer" id="mt"></span>
     <button class="primary" id="end" style="margin-left:auto">話し合いを終えて次へ</button></div>${common}${body}${qa}</div>`;
  const tick=()=>{const el=document.getElementById('mt');if(!el)return;const left=Math.max(0,sec-Math.floor((Date.now()-S.meetStart)/1000));
    el.textContent=left?`残り ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'時間です';el.classList.toggle('over',!left);};
  tick();window._mt=setInterval(tick,1000);
  document.getElementById('end').onclick=endMeeting;
  app.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>{S.homePrompt=+b.dataset.hp;render();});
  app.querySelectorAll('[data-home]').forEach(t=>t.oninput=()=>{S.regions[+t.dataset.home].home=t.value;});
}

/* ---------- 決断 ---------- */
function renderDecide(){
  if(S.decIdx>2){S.regions.forEach(r=>log(`${r.name}の決断：${r.decision==='accept'?'受け入れる':'受け入れない'}「${r.reason}」`));S.phase='outcome';return render();}
  const r=S.regions[S.decIdx];
  if(!r.human){cpuDecide(r);S.decIdx++;return render();}
  if(S.decCover){
    app.innerHTML=`<div class="card-box"><div class="cover"><h2>${r.name}の区長だけが画面を見てください</h2><p>他の区長は画面から目を離してください。決断は、全員が決めてから同時に明かします。</p><button class="primary" id="see">${r.name}の区長です。見る</button></div></div>`;
    document.getElementById('see').onclick=()=>{S.decCover=false;render();};
    return;
  }
  app.innerHTML=`<div class="card-box">
   <h2>${r.name}の区長として</h2>
   <p>国は、この町の3地区にまたがる中間貯蔵施設の建設を求めています。県内すべての市町村の土が運び込まれます。30年以内に県外で最終処分するという約束つきです。町は3地区の考えを聞き、2地区以上が受け入れれば、町として受け入れます。</p>
   <h3>いまの住民</h3>${residentsHtml(r)}${legend()}
   <h3>これまでの声</h3><ul style="line-height:1.8">${r.rolls.map((x,k)=>x?`<li>${P2EVENTS[k].title}：${esc(x.voice)}</li>`:'').join('')}</ul>
   ${r.memos.some(Boolean)?`<h3>あなたのメモ</h3><ul>${r.memos.map(m=>m?`<li>${esc(m)}</li>`:'').join('')}</ul>`:''}
   <h3>地区として、施設を受け入れますか</h3>
   <div class="choice-grid"><button class="choice ${r.decision==='accept'?'sel':''}" data-d="accept">受け入れる</button><button class="choice ${r.decision==='reject'?'sel':''}" data-d="reject">受け入れない</button></div>
   <label style="display:block">理由（住民に向けて話すつもりで）<textarea id="reason">${esc(r.reason)}</textarea></label>
   <div class="row" style="margin-top:12px"><button class="primary" id="ok" ${r.decision?'':'disabled'}>この決断で確定する</button></div>
   <p class="note">勝ち負けはありません。正解もありません。</p></div>`;
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{r.reason=document.getElementById('reason').value;r.decision=b.dataset.d;render();});
  document.getElementById('reason').oninput=e=>{r.reason=e.target.value;};
  document.getElementById('ok').onclick=()=>{S.decIdx++;S.decCover=true;render();};
}

/* ---------- 決断のあと ---------- */
function outcomeText(n,acc,rej){
  const an=acc.map(r=>r.name).join('・'),rn=rej.map(r=>r.name).join('・');
  if(n===3)return {title:'町は、施設を受け入れる',body:'3地区そろって受け入れた。地権者への説明と土地の契約が始まる。D・E・F……県内の仮置場や庭先の土が、少しずつ運び込まれていく。'};
  if(n===2)return {title:'町は、施設を受け入れる（2地区が賛成）',body:`${an}が受け入れ、${rn}は受け入れなかった。町としては受け入れる。施設は3地区にまたがるので、受け入れなかった${rn}の土地にも施設がかかる。${rn}の住民に、町はどう説明するのか。`};
  if(n===1)return {title:'町は、いまは受け入れない',body:`受け入れたのは${an}だけだった。町は国に、いまは受け入れられないと伝える。国は計画と条件を見直し、もう一度協議を求めてくる。県内の仮置場の土は、まだしばらく動かない。`};
  return {title:'町は、受け入れない',body:'3地区とも受け入れなかった。国は計画を出し直し、条件の上積みや、約束を法律にすることを検討し始める。県内の仮置場の土は、まだしばらく動かない。'};
}
function renderOutcome(){
  const acc=S.regions.filter(r=>r.decision==='accept'),rej=S.regions.filter(r=>r.decision!=='accept');
  const o=outcomeText(acc.length,acc,rej);
  app.innerHTML=`<div class="card-box">
   <h2>3人の区長の答え</h2>
   <div class="board" style="margin:12px 0">${S.regions.map(r=>{
     const pro=count(r,1),con=count(r,-1),mid=count(r,0);
     const weight=r.decision==='accept'
       ?`反対の住民${con}人・条件次第の${mid}人に、説明を続け、条件を求め続ける責任を引き受けた。`
       :`早く進めたい住民${pro}人・条件次第の${mid}人に、別の道筋を示す責任を引き受けた。`;
     return `<section class="region fade"><h2>${r.name}<small>${r.human?'人':'CPU'}</small></h2>
      <p style="font-size:22px;font-weight:800;color:${r.decision==='accept'?'var(--pro)':'var(--con)'}">${r.decision==='accept'?'受け入れる':'受け入れない'}</p>
      ${r.reason?`<p class="quote" style="font-size:13px">${esc(r.reason)}</p>`:''}
      ${residentsHtml(r)}<p style="font-size:13px;line-height:1.7">${weight}</p></section>`;}).join('')}</div>
   <div class="event fade" style="--layer:#775b98"><h2>${o.title}</h2><p>${o.body}</p></div>
   <p>どちらを選んでも、引き受ける重さがあります。実際の大熊町・双葉町では、何が起きたのでしょうか。</p>
   <div class="row"><button class="primary" id="go">振り返りへ</button><button id="save">記録を保存（JSON）</button></div></div>`;
  document.getElementById('go').onclick=()=>{S.phase='reflect';S.slide=0;render();};
  document.getElementById('save').onclick=saveJson;
}
function saveJson(){
  const data={...S,endedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`oriai-v2.1-seed${S.seed}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

     <li>あなたが決断したとき、いちばん重く見たのは、誰の、どんな声でしたか。</li>
     <li>受け入れなかった区長の理由で、あなたが納得できたものはありましたか。</li>
     <li>施設の土は、2045年3月までに県外で最終処分することが法律で決まっています。そのとき、受け入れを求められるのはどこでしょうか。</li></ol>
     <p class="note">この振り返りの史実は、上に示した公的資料と本人の証言の要約です。ゲーム内の住民の動き・効果・数値は想定であり、実際の町の世論を再現したものではありません。</p>`}
  ];
}
function renderReflect(){
  const sl=slides(),k=S.slide,s=sl[k];
  app.innerHTML=`<div class="card-box"><div class="slide fade" key="${k}"><span class="tagline">振り返り ${k+1}/${sl.length}</span><h2 style="margin-top:8px">${s.t}</h2>${s.h}</div>
   <div class="slide-nav"><button id="prev" ${k===0?'disabled':''}>← 前へ</button>
   <span>${sl.map((_,j)=>`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 3px;background:${j===k?'#4b3a63':'#d4cde0'}"></span>`).join('')}</span>
   ${k<sl.length-1?'<button class="primary" id="nxt">次へ →</button>':'<span class="row"><button id="save">記録を保存（JSON）</button><button class="primary" id="again">もう一度遊ぶ</button></span>'}</div></div>`;
  const q=id=>document.getElementById(id);
  if(q('prev'))q('prev').onclick=()=>{S.slide--;render();};
  if(q('nxt'))q('nxt').onclick=()=>{S.slide++;render();};
  if(q('save'))q('save').onclick=saveJson;
  if(q('again'))q('again').onclick=()=>{S=null;render();};
}

document.addEventListener('keydown',e=>{
  if(S?.phase==='reflect'&&!['TEXTAREA','INPUT'].includes(document.activeElement?.tagName)){
    if(e.key==='ArrowRight'&&S.slide<slides().length-1){S.slide++;render();}
    if(e.key==='ArrowLeft'&&S.slide>0){S.slide--;render();}
  }
});
render();
</script>
